preprocess:
  max_long_edge: 1000
  tone_mode: raw
  auto_rotate_ocr:
    enabled: true
    max_long_edge: 1200
  deskew:
    enabled: true
    max_abs_degrees: 20
    min_abs_degrees: 0.35
  perspective:
    enabled: true
    min_area_ratio: 0.08
    approx_epsilon_ratios:
    - 0.02
    - 0.03
    - 0.045
    - 0.06
    max_detect_long_edge: 1200
    rect_area_expand_ratio: 0.2
lecture_scan:
  vlm:
    max_workers: 4
    use_preprocess: true
    temperature: 0.1
    timeout_seconds: 300.0
  assemble:
    temperature: 0.2
    timeout_seconds: 300.0
    max_chars_per_batch: 8000
  lecture:
    max_workers: 4
refine:
  max_workers: 8
  temperature: 0.2
  web_search: true
  timeout_seconds: 300.0
lecture_content:
  max_workers: 4
  temperature: 0.4
  web_search: true
  timeout_seconds: 300.0
