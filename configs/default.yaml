preprocess:
  max_long_edge: 1000
  tone_mode: raw
  auto_exif: true
  auto_rotate: true
  rotate_degrees: 0
  deskew:
    enabled: true
    max_abs_degrees: 20
    min_abs_degrees: 0.35
page_text:
  subdir: pages
  manifest: pages.jsonl
vlm:
  model: qwen3.5-flash
  max_workers: 8
  max_long_edge: 1500
  use_preprocess: false
  temperature: 0.1
  timeout_seconds: 300.0
refine:
  model: qwen3-max
  batch_size: 1
  max_workers: 8
  temperature: 0.2
  stream_refine: false
  use_kb: false
  web_search: true
  lecture_tips_with_refine: true
  lecture_content_after_refine: true
  timeout_seconds: 300.0
lecture_content:
  model: null
  batch_size: 1
  max_workers: 4
  temperature: 0.4
  web_search: true
  timeout_seconds: 300.0
lecture_tips:
  model: null
  batch_size: 1
  max_workers: 8
  temperature: 0.35
  web_search: true
  timeout_seconds: 300.0
