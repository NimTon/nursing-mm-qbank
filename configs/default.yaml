# mm-qbank vlm-text：VLM 读图前可选本地预处理（缩放/纠偏/去阴影等）
preprocess:
  # 0 = 不缩小原图；正数 = 长边上限，例如 3000
  max_long_edge: 0
  tone_mode: raw
  # 自动按 EXIF 方向纠正（手机竖拍常见）
  auto_exif: true
  # 自动判断 0/90/180/270（按“横排文字”启发式打分选择）
  auto_rotate: true
  # 固定旋转角度（度）。例如 90/180/270；0 表示不额外旋转
  rotate_degrees: 0
  deskew:
    enabled: true
    max_abs_degrees: 20
    min_abs_degrees: 0.35

# 输出子路径：{out_dir}/{subdir}/{page_id}.* 与 pages.jsonl
page_text:
  subdir: pages
  manifest: pages.jsonl

# 多模态 VLM 整页转写（按次计费；未填 max_long_edge 时回退 preprocess.max_long_edge）
vlm:
  # 须为「图像+文本」多模态名（如百炼 qwen-vl-plus / qwen3-vl-plus、OpenAI gpt-4o）；填纯文本模型（如 qwen3-max）会跑通接口但 items 常为空
  model: qwen3.6-plus
  # 多图同时请求 VLM 的线程数（整批跑完再进入 llm-compose；缺省为 CPU 与任务数合算的上限）
  max_workers: 8
  max_long_edge: 2000
  use_preprocess: true
  temperature: 0.1
  timeout_seconds: 300.0

# llm-compose：已改为**离线提取**（从每页 structured_file 的 composed_items 汇总为 jsonl），不再调用模型，因此无需 model/temperature/max_workers 配置

# vlm-refine：按题号合并后教材向修正，并导 xlsx
# web_search: true 时对类 DashScope 基址可附加联网请求头（以供应商为准）
refine:
  model: qwen3-max
  batch_size: 1
  # 多批题块同时请求修正 LLM（批与 batch_size 同序；VLM+compose 均完成后再跑本步）
  max_workers: 8
  temperature: 0.2
  web_search: true
  timeout_seconds: 300.0
