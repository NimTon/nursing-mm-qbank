# mm-qbank vlm-text：VLM 读图前可选本地预处理（缩放/纠偏/去阴影等）
preprocess:
  # 0 = 不缩小原图；正数 = 长边上限，例如 3000
  max_long_edge: 1000
  tone_mode: raw
  # 自动按 EXIF 方向纠正（手机竖拍常见）
  auto_exif: true
  # 自动判断 0/90/180/270（按“横排文字”启发式打分选择）
  auto_rotate: true
  # 固定旋转角度（度）。例如 90/180/270；0 表示不额外旋转
  rotate_degrees: 0
  deskew:
    enabled: true
    max_abs_degrees: 20
    min_abs_degrees: 0.35

# 输出子路径：{out_dir}/{subdir}/{page_id}.* 与 pages.jsonl
page_text:
  subdir: pages
  manifest: pages.jsonl

# 多模态 VLM 整页转写（按次计费；未填 max_long_edge 时回退 preprocess.max_long_edge）
vlm:
  # 须为「图像+文本」多模态名（如百炼 qwen-vl-plus / qwen3-vl-plus、OpenAI gpt-4o）；填纯文本模型（如 qwen3-max）会跑通接口但 items 常为空
  model: qwen3.5-flash # qwen3.6-plus
  # 多图同时请求 VLM 的线程数（整批跑完再进入 llm-compose；缺省为 CPU 与任务数合算的上限）
  max_workers: 8
  max_long_edge: 1500
  use_preprocess: false
  temperature: 0.1
  timeout_seconds: 300.0

# llm-compose：已改为**离线提取**（从每页 structured_file 的 composed_items 汇总为 jsonl），不再调用模型，因此无需 model/temperature/max_workers 配置

# vlm-refine：按题号合并后教材向修正，并导 xlsx
# web_search: true 时对类 DashScope 基址可附加联网请求头（以供应商为准）
refine:
  model: qwen3-max # deepseek-v4-flash qwen3-32b
  batch_size: 1
  # 多批题块同时请求修正 LLM（批与 batch_size 同序；VLM+compose 均完成后再跑本步）
  max_workers: 8
  temperature: 0.2
  # 是否启用“凑题缓存→流式喂给 LLM 修正”：
  # - false：顺序模式（先 VLM 全跑完落盘，再跨页合并题号→批量修正）
  # - true ：流式模式（VLM 每页完成就进入题号缓冲，凑齐同题问题+解析即入批，满批就请求修正并流式写 CSV）
  stream_refine: false
  # 是否注入离线知识库（data/kb 下的 FAISS KB）检索片段到 prompt。
  # 与 web_search 脱钩：两者可同时为 true（同时具备“离线 KB 参考” + “联网搜索”）。
  use_kb: false
  web_search: true
  # true：教材向修正与「讲师提醒」在同一次 LLM 调用中输出（改 prompt，不二次请求）
  lecture_tips_with_refine: true
  timeout_seconds: 300.0

# 从结果 xlsx 写「讲师提醒」：web_search 仅作用于本功能（与上方 refine.web_search 独立）
# true 时若 LLM 基址为类 DashScope 可附加联网头（以供应商与控制台为准，是否真联网不保证）
lecture_tips:
  model: null
  batch_size: 1
  max_workers: 8
  temperature: 0.35
  web_search: true
  timeout_seconds: 300.0
