[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nursing-mm-qbank"
version = "0.1.7"
description = "护理题库：VLM 转写与教材向修正（xlsx/jsonl）；LLM「讲师提醒」「讲课内容」（要点/口播稿 + Word 讲义）；GUI 勾选同步 configs/default.yaml；mm-qbank / mm-qbank-gui"
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "pillow>=10.0.0",
  "openai>=1.40.0",
  "openpyxl>=3.1.0",
  "python-docx>=1.1.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "sv-ttk>=2.6.0",
]

[project.scripts]
mm-qbank = "mm_qbank.cli:main"
mm-qbank-gui = "mm_qbank.gui_app:main"

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
