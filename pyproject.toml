[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nursing-mm-qbank"
version = "0.1.9"
description = "护理题库：教师讲解 / 题目修正（scan→assemble→终步 LLM）；mm-qbank / mm-qbank-gui"
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "pillow>=10.0.0",
  "openai>=1.40.0",
  "openpyxl>=3.1.0",
  "python-docx>=1.1.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "sv-ttk>=2.6.0",
]

[project.scripts]
mm-qbank = "mm_qbank.cli:main"
mm-qbank-gui = "mm_qbank.gui_app:main"

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]
# paddleclas 声明 opencv<=4.6，与主项目 opencv>=4.8 在 pip 解析时冲突；实际可用 4.8+，需 --no-deps 安装：
#   pip install -e ".[pulc]" && pip install "paddleclas>=2.6.0" --no-deps
pulc = ["paddlepaddle>=3.0.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
